<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Liturgies for use during services at St Aidan's Anglican Church, Strathmore.">
  <title>Liturgies — St Aidan's</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0a09'/%3E%3Crect x='14' y='6' width='4' height='20' rx='1.5' fill='%23fcd34d'/%3E%3Crect x='8' y='12' width='16' height='4' rx='1.5' fill='%23fcd34d'/%3E%3C/svg%3E">
  <style>
    /* Lumen (armature-ui) tokens, inlined — this is a dependency-free static page.
       Brand knob set to Lumen amber to match the gold-on-dark liturgy pages. */
    :root {
      --ink-950: #09090b; --ink-900: #18181b; --ink-800: #27272a; --ink-700: #3f3f46;
      --ink-500: #71717a; --ink-400: #a1a1aa; --ink-300: #d4d4d8; --ink-100: #f4f4f5;
      --ink-0: #fafafa;

      --amber-400: oklch(0.8369 0.1644 89.43);

      --bg: var(--ink-950);
      --surface: var(--ink-900);
      --surface-elevated: var(--ink-800);
      --border-subtle: var(--ink-800);
      --border: var(--ink-700);
      --text-strong: var(--ink-0);
      --text-body: var(--ink-100);
      --text-muted: var(--ink-300);
      --text-subtle: var(--ink-400);

      --brand: var(--amber-400);
      --brand-contrast: #2a1e04;
      --accent: var(--brand);
      --accent-soft: color-mix(in oklch, var(--accent) 14%, var(--surface));
      --accent-text: color-mix(in oklch, var(--accent), white 18%);

      --radius-card: 8px;
      --font-sans: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { background: var(--bg); min-height: 100%; }

    body {
      font-family: var(--font-sans);
      color: var(--text-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: clamp(24px, 5vw, 56px) 20px 32px;
    }

    .wrap { width: 100%; max-width: 640px; margin: 0 auto; flex: 1; }

    .eyebrow {
      font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
      color: var(--accent-text); margin-bottom: 6px;
    }
    h1 { font-size: clamp(26px, 5vw, 34px); font-weight: 700; color: var(--text-strong); }
    .lede { font-size: 16px; color: var(--text-muted); margin-top: 8px; margin-bottom: 28px; }

    /* Groups — Sundays / Weekdays / Pastoral. Only groups with entries appear. */
    .group + .group { margin-top: 30px; }
    .group__label {
      font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
      color: var(--text-subtle); margin-bottom: 10px;
    }

    /* Liturgy cards — whole card is the tap target, sized for tablets in hand */
    .list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .lit {
      display: flex; align-items: center; gap: 16px;
      min-height: 72px; padding: 16px 18px;
      background: var(--surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      text-decoration: none; color: inherit;
      transition: border-color 120ms ease, background 120ms ease;
    }
    .lit:hover, .lit:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
    .lit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .lit:active { background: var(--surface-elevated); }
    .lit__mark {
      width: 40px; height: 40px; flex-shrink: 0; border-radius: 8px;
      background: var(--surface-elevated); border: 1px solid var(--border-subtle);
      display: grid; place-items: center;
    }
    .lit__mark svg { width: 20px; height: 20px; }
    .lit__body { flex: 1; min-width: 0; }
    .lit__title { display: block; font-size: 18px; font-weight: 600; color: var(--text-strong); }
    .lit__date { display: block; font-size: 14px; color: var(--text-subtle); margin-top: 2px; }
    .lit__go { flex-shrink: 0; color: var(--text-subtle); }
    .lit__go svg { width: 18px; height: 18px; display: block; }

    .state { padding: 20px 4px; font-size: 15px; color: var(--text-subtle); }
    .state--error { color: var(--text-muted); }

    footer {
      margin-top: 40px; text-align: center;
      font-size: 12.5px; color: var(--ink-500);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">St Aidan&rsquo;s Anglican Church, Strathmore</p>
      <h1>Liturgies</h1>
      <p class="lede">Select the liturgy for today&rsquo;s service.</p>
    </header>

    <main>
      <div id="list"></div>
      <p class="state" id="state">Loading liturgies&hellip;</p>
      <noscript><p class="state state--error">This page needs JavaScript to list the liturgies.</p></noscript>
    </main>
  </div>

  <footer>Ordo &middot; temporary liturgy host</footer>

  <script>
    const list = document.getElementById("list");
    const state = document.getElementById("state");

    const CROSS = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="10.5" y="3" width="3" height="18" rx="1" fill="var(--accent)"/><rect x="5" y="8" width="14" height="3" rx="1" fill="var(--accent)"/></svg>`;
    const CHEVRON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`;

    fetch("liturgies.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then((liturgies) => {
        if (!Array.isArray(liturgies) || liturgies.length === 0) {
          state.textContent = "No liturgies are published yet.";
          return;
        }
        list.innerHTML = "";
        state.remove();

        function card(l) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "lit";
          a.href = l.href;

          const mark = document.createElement("span");
          mark.className = "lit__mark";
          mark.innerHTML = CROSS;

          const body = document.createElement("span");
          body.className = "lit__body";
          const title = document.createElement("span");
          title.className = "lit__title";
          title.textContent = l.title;
          const date = document.createElement("span");
          date.className = "lit__date";
          date.textContent = l.date;
          body.append(title, date);

          const go = document.createElement("span");
          go.className = "lit__go";
          go.innerHTML = CHEVRON;

          a.append(mark, body, go);
          li.append(a);
          return li;
        }

        /* Fixed order. Anything with no group, or a group not named here, falls
           into "Other" rather than disappearing from the list. */
        const GROUPS = [
          ["sunday", "Sundays"],
          ["weekday", "Weekdays"],
          ["pastoral", "Pastoral"],
        ];
        const known = new Set(GROUPS.map(([key]) => key));

        for (const [key, label] of GROUPS.concat([[null, "Other"]])) {
          const inGroup = liturgies.filter((l) =>
            key ? l.group === key : !known.has(l.group)
          );
          if (inGroup.length === 0) continue;

          const section = document.createElement("section");
          section.className = "group";
          const heading = document.createElement("h2");
          heading.className = "group__label";
          heading.textContent = label;
          const ul = document.createElement("ul");
          ul.className = "list";
          for (const l of inGroup) ul.append(card(l));
          section.append(heading, ul);
          list.append(section);
        }
      })
      .catch(() => {
        state.className = "state state--error";
        state.textContent = "Couldn’t load the liturgy list. Pull down to refresh, or try again shortly.";
      });
  </script>
</body>
</html>
